name: Desktop build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run check:release
      - run: npm run build
      - run: npm run check:pipeline
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "if(process.env.RELEASE_TAG!=='v'+require('./package.json').version)throw Error('Release tag must match package.json version')"

  signing:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      windows-ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check Windows signing credentials
        id: check
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$WIN_CSC_LINK" && -n "$WIN_CSC_KEY_PASSWORD" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF" != refs/tags/v1.0.0 ]]; then
              echo '::error::Windows signing certificate is required for a release. Configure WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD.'
              exit 1
            fi
            echo '::warning::Windows signed package skipped: certificate secrets have not been configured. No unsigned Windows package will be published.'
          fi

  mac:
    if: github.event_name != 'pull_request'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Package macOS with ad-hoc signature
        run: npm run dist:mac -- --${{ matrix.arch }}
      - name: Verify app and ad-hoc signature
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          app=$(find release -maxdepth 2 -name '*.app' -type d -print -quit)
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep 'Signature=adhoc'
          node scripts/verify-package.cjs "$app/Contents/Resources/app.asar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: [verify, signing]
    if: github.event_name != 'pull_request' && needs.signing.outputs.windows-ready == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build signed Windows x64 installer
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:win
      - name: Verify installer and executable signatures
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release -Filter '*Setup.exe') + @(Get-Item release/win-unpacked/whg.exe)
          if ($files.Count -lt 2) { throw 'Missing installer or application executable' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($file.Name)" }
          }
          node scripts/verify-package.cjs release/win-unpacked/resources/app.asar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64
          path: |
            release/*Setup.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

  release:
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.mac.result == 'success' && needs.signing.result == 'success' &&
      (needs.windows.result == 'success' ||
       (github.ref == 'refs/tags/v1.0.0' && needs.windows.result == 'skipped'))
    needs: [mac, windows, signing]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Verify and collect release files
        run: node scripts/prepare-release.cjs artifacts release-upload
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          notes="docs/releases/${RELEASE_TAG#v}.md"
          if [[ -f "$notes" ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "万稿汇 $RELEASE_TAG" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "万稿汇 $RELEASE_TAG" --generate-notes
          fi
          find release-upload -type f -print0 | xargs -0 gh release upload "$RELEASE_TAG"
